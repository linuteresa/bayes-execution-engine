[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-execution-engine"
version = "1.0.0"
description = "Plan-and-Execute agent orchestration with a conjugate Bayesian conflict resolver, served over an async API. Local LLM inference via llama.cpp."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["main", "demo"]

[tool.setuptools.packages.find]
include = ["bayesian_engine*", "core*", "nodes*", "persistence*", "scaling*", "service*", "eval*"]
exclude = ["eval.results*", "tests*", "graphify-out*"]

[tool.setuptools.package-data]
eval = ["data/*.jsonl"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_verify", "_verify2", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]  # pycodestyle, pyflakes, isort, bugbear
ignore = ["E501"]  # long docstrings/tables allowed

[tool.ruff.lint.isort]

known-first-party = ["core", "nodes", "bayesian_engine", "scaling", "persistence", "service", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
